<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg_wg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg_wg)"/>
  <!-- wine glass shape -->
  <path d="M148,80 Q130,140 140,185 Q155,235 200,245 Q245,235 260,185 Q270,140 252,80 Z" fill="#fff" opacity="0.25"/>
  <path d="M152,88 Q136,145 146,187 Q160,232 200,240 Q240,232 254,187 Q264,145 248,88 Z" fill="#e9d5ff" opacity="0.7"/>
  <!-- wine fill -->
