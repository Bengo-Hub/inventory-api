<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg_cktl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg_cktl)"/>
  <!-- glass body (martini) -->
  <path d="M110,100 L200,240 L290,100 Z" fill="#fff" opacity="0.2"/>
  <path d="M115,108 L200,235 L285,108 Z" fill="#fff" opacity="0.15"/>
  <!-- liquid fill -->
  <path d="M148,165 L200,235 L252,165 Z" fill="#f9a8d4" opacity="0.85"/>
  <!-- rim line -->
  <line x1="110" y1="100" x2="290" y2="100" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- stem -->
  <line x1="200" y1="240" x2="200" y2="310" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <!-- base -->
  <ellipse cx="200" cy="315" rx="55" ry="12" fill="#fff" opacity="0.9"/>
  <!-- olive on pick -->
  <line x1="155" y1="105" x2="195" y2="150" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="152" cy="106" r="10" fill="#4ade80"/>
  <circle cx="152" cy="106" r="4" fill="#ef4444"/>
  <!-- bubbles -->
  <circle cx="185" cy="195" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="210" cy="210" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="196" cy="215" r="2" fill="#fff" opacity="0.4"/>
</svg>
