basePath: /api/v1
definitions:
  bulkjob.Status:
    enum:
    - queued
    - queued
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - DefaultStatus
    - StatusQueued
    - StatusRunning
    - StatusCompleted
    - StatusFailed
  ent.BulkJob:
    properties:
      completed_at:
        description: CompletedAt holds the value of the "completed_at" field.
        type: string
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      created_by:
        description: CreatedBy holds the value of the "created_by" field.
        type: string
      error:
        description: Set when status=failed and the job aborted entirely (not per-line
          skips, which live in result)
        type: string
      failed_count:
        description: Skipped/failed line items so far
        type: integer
      id:
        description: ID of the ent.
        type: string
      job_type:
        description: e.g. item_relocation, bulk_stock_adjust — free-form, not an enum,
          so a new bulk action can adopt this without a migration
        type: string
      payload:
        additionalProperties: true
        description: The original request, for the runner to replay/inspect
        type: object
      processed:
        description: Successfully applied line items so far
        type: integer
      result:
        additionalProperties: true
        description: Per-line skip/failure details once the job finishes
        type: object
      started_at:
        description: StartedAt holds the value of the "started_at" field.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/bulkjob.Status'
        description: Status holds the value of the "status" field.
      tenant_id:
        description: TenantID holds the value of the "tenant_id" field.
        type: string
      total:
        description: Total line items in the job
        type: integer
    type: object
  handlers.BulkImportResult:
    properties:
      items:
        $ref: '#/definitions/handlers.importResult'
      modifiers:
        $ref: '#/definitions/handlers.importResult'
      recipes:
        $ref: '#/definitions/handlers.importResult'
      stock:
        $ref: '#/definitions/handlers.importResult'
    type: object
  handlers.MenuItemCompositeRequest:
    properties:
      category_name:
        type: string
      description:
        type: string
      image_url:
        type: string
      ingredients:
        description: ── Ingredient lines ──────────────────────────────────────────────────────
        items:
          $ref: '#/definitions/handlers.MenuItemIngredientInput'
        type: array
      is_perishable:
        type: boolean
      modifiers:
        description: ── Modifiers (optional) ──────────────────────────────────────────────────
        items:
          $ref: '#/definitions/handlers.MenuItemModifierInput'
        type: array
      name:
        type: string
      non_billable:
        description: |-
          Non-billable: never charged at POS even when a selling price exists (free
          accompaniments like ugali, greens). Pointer so an absent field never clobbers
          the stored flag on upsert. When true, selling_price 0 is allowed.
        type: boolean
      prep_time_minutes:
        type: integer
      selling_price:
        description: user-provided final price
        type: number
      servings:
        description: ── Recipe fields ─────────────────────────────────────────────────────────
        type: number
      sku:
        description: ── Item fields ───────────────────────────────────────────────────────────
        type: string
      tags:
        items:
          type: string
        type: array
      target_margin_percent:
        description: fallback to tenant default
        type: number
      unit_content_qty:
        description: |-
          Content per portion — how much one output portion contains (300 + "ml" for a pot
          of tea). Required for OTHER recipes to reference this item in ml/g lines; also
          what the deduction/costing paths bridge through.
        type: number
      unit_content_uom:
        type: string
      usable_in_recipes:
        description: |-
          Reusable menu component: this RECIPE item may be picked as an ingredient in
          OTHER recipes (e.g. Black Tea inside an Iced Passion Tea). Pointer so an absent
          field never clobbers the stored flag on upsert.
        type: boolean
    type: object
  handlers.MenuItemCompositeResponse:
    properties:
      item:
        $ref: '#/definitions/items.ItemDTO'
      recipe:
        $ref: '#/definitions/recipes.RecipeDTO'
      reorder_seeds:
        items:
          $ref: '#/definitions/handlers.ReorderSeed'
        type: array
      warnings:
        items:
          type: string
        type: array
    type: object
  handlers.MenuItemIngredientInput:
    properties:
      cost_price:
        description: If EP cost is known directly, set cost_price (bypasses purchase
          field calculation).
        type: number
      ingredient_name:
        description: Reference — one of these two must be set.
        type: string
      ingredient_sku:
        description: matched by SKU (takes priority)
        type: string
      notes:
        type: string
      purchase_pack_size:
        type: number
      purchase_price:
        description: Optional purchase/supplier fields — only needed when creating
          a NEW ingredient.
        type: number
      purchase_unit:
        type: string
      qty:
        description: Quantity and unit for this recipe line.
        type: number
      unit:
        description: e.g. "g", "ml", "tsp", "clove"
        type: string
      waste_percent:
        description: Optional waste factor (0-99, default 0).
        type: number
      yield_pct:
        type: number
    type: object
  handlers.MenuItemModifierInput:
    properties:
      group_name:
        type: string
      is_required:
        type: boolean
      max_selections:
        type: integer
      min_selections:
        type: integer
      options:
        items:
          $ref: '#/definitions/handlers.MenuItemModifierOptionInput'
        type: array
    type: object
  handlers.MenuItemModifierOptionInput:
    properties:
      is_default:
        type: boolean
      name:
        type: string
      price_adjustment:
        type: number
      stock_sku:
        description: inventory item SKU for stock deduction
        type: string
    type: object
  handlers.ReorderSeed:
    properties:
      reorder_level:
        type: integer
      reorder_qty:
        type: integer
      sku:
        type: string
      source:
        description: '"DEFAULT" or "UNIT_DEFAULT"'
        type: string
    type: object
  handlers.approvalActionDTO:
    properties:
      acted_at:
        type: string
      acted_by:
        type: string
      approver_role:
        type: string
      comment:
        type: string
      id:
        type: string
      name:
        type: string
      sequence:
        type: integer
      status:
        type: string
    type: object
  handlers.approvalRequestDTO:
    properties:
      actions:
        items:
          $ref: '#/definitions/handlers.approvalActionDTO'
        type: array
      amount:
        type: number
      created_at:
        type: string
      current_sequence:
        type: integer
      current_step:
        $ref: '#/definitions/handlers.approvalActionDTO'
      decided_at:
        type: string
      id:
        type: string
      module:
        type: string
      object_id:
        type: string
      object_reference:
        type: string
      status:
        type: string
    type: object
  handlers.approvalRuleDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      max_amount:
        type: number
      min_amount:
        type: number
      module:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/handlers.approvalStepDTO'
        type: array
    type: object
  handlers.approvalRulePayload:
    properties:
      is_active:
        type: boolean
      max_amount:
        type: number
      min_amount:
        type: number
      module:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/handlers.approvalStepPayload'
        type: array
    type: object
  handlers.approvalStepDTO:
    properties:
      approver_role:
        type: string
      id:
        type: string
      name:
        type: string
      sequence:
        type: integer
    type: object
  handlers.approvalStepPayload:
    properties:
      approver_role:
        type: string
      name:
        type: string
      sequence:
        type: integer
    type: object
  handlers.assetCategoryPayload:
    properties:
      depreciation_rate:
        type: number
      description:
        type: string
      name:
        type: string
      parent_id:
        type: string
      useful_life_years:
        type: integer
    type: object
  handlers.assetPayload:
    properties:
      asset_tag:
        type: string
      barcode:
        type: string
      category_id:
        type: string
      condition:
        type: string
      created_by:
        type: string
      custodian_id:
        type: string
      depreciation_method:
        type: string
      depreciation_rate:
        type: number
      description:
        type: string
      item_id:
        type: string
      kra_ca_class:
        description: KRA capital-allowance class → carried to treasury
        type: string
      location:
        type: string
      manufacturer:
        type: string
      model:
        type: string
      name:
        type: string
      notes:
        type: string
      outlet_id:
        type: string
      purchase_cost:
        type: number
      purchase_date:
        type: string
      salvage_value:
        type: number
      serial_number:
        type: string
    type: object
  handlers.batchRawMaterialDTO:
    properties:
      cost:
        type: number
      id:
        type: string
      item_id:
        type: string
      quantity:
        type: number
      unit_id:
        type: string
    type: object
  handlers.bulkAdjustStockRequest:
    properties:
      lines:
        items:
          properties:
            adjustment:
              type: number
            destination_warehouse_id:
              description: |-
                DestinationWarehouseID, when set, moves this line's quantity from WarehouseID to this
                warehouse (transfer_out + transfer_in) instead of an in-place add/remove — see
                stock.BulkAdjustLine's doc comment.
              type: string
            sku:
              type: string
          type: object
        type: array
      notes:
        type: string
      reason:
        type: string
      reference:
        type: string
      warehouse_id:
        type: string
    type: object
  handlers.bulkItemActionRequest:
    properties:
      action:
        description: 'bulk-status only: one of activate | deactivate | not_for_sale_on
          | not_for_sale_off.'
        type: string
      ids:
        description: Item ids (uuids). The DataTable selects by row id.
        items:
          type: string
        type: array
    type: object
  handlers.bulkJobAccepted:
    properties:
      job_id:
        type: string
      status:
        type: string
      total:
        type: integer
    type: object
  handlers.contractDTO:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      project_id:
        type: string
      rfq_id:
        type: string
      start_date:
        type: string
      status:
        type: string
      supplier_id:
        type: string
      terms:
        type: string
      title:
        type: string
      value:
        type: number
    type: object
  handlers.contractPayload:
    properties:
      end_date:
        type: string
      project_id:
        type: string
      rfq_id:
        type: string
      start_date:
        type: string
      supplier_id:
        type: string
      terms:
        type: string
      title:
        type: string
      value:
        type: number
    type: object
  handlers.createPOInput:
    properties:
      additional_shipping_charges:
        type: number
      expected_date:
        description: accepts "YYYY-MM-DD" or RFC3339
        type: string
      line_items:
        items:
          $ref: '#/definitions/handlers.createPOLineInput'
        type: array
      notes:
        type: string
      order_date:
        description: |-
          OrderDate lets staff record the order under a business date other than today — e.g. a PO
          placed with the supplier by phone days ago, only entered into the system now. Accepts
          "YYYY-MM-DD" or RFC3339, same as ExpectedDate/PurchaseReturn's DateReturned. Blank/omitted
          leaves it unset — the PO reports under created_at, the pre-feature default.
        type: string
      pay_term_days:
        type: integer
      supplier_id:
        type: string
      warehouse_id:
        type: string
    type: object
  handlers.createPOLineInput:
    properties:
      item_id:
        type: string
      new_selling_price:
        description: |-
          Selling-price adjustment decided at order time. Applied only when this line is actually
          received (see postGoodsReceiptCore) — nothing changes at PO creation/amend time.
        type: number
      price_scope:
        type: string
      quantity:
        type: number
      unit_cost:
        type: number
      unit_id:
        description: FK to Unit — unit of measure ordered in (e.g. kg, box); optional
        type: string
    type: object
  handlers.grnDTO:
    properties:
      grn_number:
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.grnLineDTO'
        type: array
      notes:
        type: string
      purchase_order_id:
        type: string
      received_by:
        type: string
      received_by_name:
        description: |-
          ReceivedByName is ReceivedBy resolved to a display name — who actually received this
          stock, surfaced so admins/managers can audit purchases the same way as adjustments.
        type: string
      received_date:
        type: string
      status:
        type: string
      supplier_id:
        type: string
      warehouse_id:
        type: string
      warehouse_name:
        description: |-
          WarehouseName is the receiving outlet/warehouse's human name — enriched by the API so
          list/detail views never have to render (or re-fetch) a raw warehouse UUID.
        type: string
    type: object
  handlers.grnLineDTO:
    properties:
      barcode:
        type: string
      id:
        type: string
      item_id:
        type: string
      item_name:
        description: Human identifiers so the UI never has to render raw item UUIDs
          in the receipt drawer.
        type: string
      lot_number:
        type: string
      new_selling_price:
        type: number
      price_scope:
        type: string
      purchase_order_line_id:
        type: string
      quantity_accepted:
        type: number
      quantity_received:
        type: number
      quantity_rejected:
        type: number
      rejection_reason:
        type: string
      serials:
        items:
          type: string
        type: array
      sku:
        type: string
      unit_cost:
        type: number
    type: object
  handlers.grnLinePayload:
    properties:
      expiry_date:
        type: string
      item_id:
        type: string
      lot_number:
        description: |-
          Lot/batch capture for lot-tracked items: a lot number + optional expiry. Becomes an
          InventoryLot layer (for FIFO/FEFO costing) when the GRN is posted.
        type: string
      new_selling_price:
        description: |-
          NewSellingPrice + PriceScope let the merchant adjust the customer-facing price for this
          item alongside the receipt's cost. Applied at post time (see postGoodsReceiptCore):
          "all_stock" (default) applies immediately and everywhere; "new_stock_only" queues it via
          PendingPriceChange so stock already on hand keeps selling at its current price until it's
          sold through.
        type: number
      price_scope:
        type: string
      purchase_order_line_id:
        type: string
      quantity_accepted:
        type: number
      quantity_received:
        type: number
      quantity_rejected:
        type: number
      rejection_reason:
        type: string
      serials:
        description: |-
          Serials are captured for serial-tracked items: one serial per accepted unit. Each becomes
          an InventorySerial row (status=available) when the GRN is posted.
        items:
          type: string
        type: array
      unit_cost:
        type: number
    type: object
  handlers.grnPayload:
    properties:
      lines:
        items:
          $ref: '#/definitions/handlers.grnLinePayload'
        type: array
      notes:
        type: string
      received_by:
        type: string
      warehouse_id:
        type: string
    type: object
  handlers.importResult:
    properties:
      created:
        type: integer
      errors:
        items:
          type: string
        type: array
      failed:
        type: integer
      updated:
        type: integer
    type: object
  handlers.livenessResponse:
    properties:
      service:
        example: inventory-api
        type: string
      status:
        example: ok
        type: string
    type: object
  handlers.materialVarianceDTO:
    properties:
      actual:
        type: number
      item_id:
        type: string
      item_sku:
        type: string
      planned:
        type: number
      variance:
        type: number
    type: object
  handlers.productionBatchDTO:
    properties:
      actual_quantity:
        type: number
      batch_number:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      labor_cost:
        type: number
      material_variance:
        items:
          $ref: '#/definitions/handlers.materialVarianceDTO'
        type: array
      notes:
        type: string
      outlet_id:
        type: string
      overhead_cost:
        type: number
      planned_quantity:
        type: number
      quality_checks:
        items:
          $ref: '#/definitions/handlers.qualityCheckDTO'
        type: array
      raw_materials:
        items:
          $ref: '#/definitions/handlers.batchRawMaterialDTO'
        type: array
      recipe_id:
        type: string
      scheduled_date:
        type: string
      scrap_quantity:
        type: number
      start_date:
        type: string
      status:
        type: string
      unit_cost:
        type: number
      yield_variance:
        description: Variance (populated on the detail view only).
        type: number
      yield_variance_pct:
        description: (actual-planned)/planned * 100
        type: number
    type: object
  handlers.productionBatchPayload:
    properties:
      created_by:
        type: string
      labor_cost:
        type: number
      notes:
        type: string
      outlet_id:
        type: string
      overhead_cost:
        type: number
      planned_quantity:
        type: number
      recipe_id:
        type: string
      scheduled_date:
        type: string
      supervisor_id:
        type: string
    type: object
  handlers.purchaseOrderDTO:
    properties:
      additional_shipping_charges:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      created_by_name:
        description: |-
          CreatedByName is CreatedBy resolved to a display name — who raised this purchase order,
          surfaced for the same "who did what" audit trail as adjustments/goods receipts.
        type: string
      expected_date:
        type: string
      id:
        type: string
      notes:
        type: string
      order_date:
        description: |-
          OrderDate is the business date the order was raised — overrides CreatedAt for
          display/reporting when set (nil means "use created_at", the pre-feature default).
        type: string
      pay_term_days:
        type: integer
      po_number:
        type: string
      status:
        type: string
      supplier_id:
        type: string
      supplier_name:
        type: string
      total_amount:
        type: number
      warehouse_id:
        type: string
      warehouse_name:
        type: string
    type: object
  handlers.purchaseReturnDTO:
    properties:
      added_by:
        type: string
      added_by_name:
        type: string
      date_returned:
        description: |-
          DateReturned is the calendar day the goods went back (stored at 00:00 UTC for a
          date-only entry). DateReturnedDay is that day as YYYY-MM-DD so clients can render it
          without timezone conversion shifting it to the previous day.
        type: string
      date_returned_day:
        type: string
      goods_receipt_id:
        type: string
      id:
        type: string
      item_count:
        type: integer
      items_summary:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseReturnLineDTO'
        type: array
      outlet_id:
        type: string
      payment_status:
        type: string
      purchase_order_id:
        type: string
      reason:
        type: string
      return_amount:
        type: number
      return_number:
        type: string
      stock_warnings:
        description: |-
          StockWarnings lists items whose stock-out failed on approval (logged too), so the
          approver sees it immediately instead of discovering a stock gap later.
        items:
          type: string
        type: array
      supplier_id:
        type: string
      supplier_name:
        type: string
      total_quantity:
        type: number
      warehouse_id:
        description: |-
          WarehouseID is the location the goods leave from: the return's own warehouse, else (for a
          return raised before warehouse capture existed) the linked goods receipt's warehouse.
        type: string
      warehouse_name:
        type: string
    type: object
  handlers.purchaseReturnLineDTO:
    properties:
      id:
        type: string
      item_id:
        type: string
      item_name:
        type: string
      lot_id:
        type: string
      quantity:
        type: number
      sku:
        type: string
      sub_total:
        type: number
      unit_cost:
        type: number
    type: object
  handlers.purchaseReturnLinePayload:
    properties:
      item_id:
        type: string
      lot_id:
        description: |-
          LotID optionally targets a specific batch of a lot-tracked item (pharmacy RTV of an
          expiring batch).
        type: string
      quantity:
        type: number
      sub_total:
        type: number
    type: object
  handlers.purchaseReturnPayload:
    properties:
      date_returned:
        description: |-
          DateReturned accepts "YYYY-MM-DD" (stored as that calendar day) or RFC3339; when omitted
          the return defaults to now.
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseReturnLinePayload'
        type: array
      purchase_order_id:
        type: string
      reason:
        type: string
      supplier_id:
        type: string
      warehouse_id:
        description: |-
          WarehouseID is the location the goods leave from. Omitted, it defaults to the operating
          outlet's own warehouse (X-Outlet-ID), then the tenant default: the same resolution a
          goods receipt uses, so a return always comes out of the outlet that raised it.
        type: string
    type: object
  handlers.qualityCheckDTO:
    properties:
      check_date:
        type: string
      id:
        type: string
      inspector_id:
        type: string
      notes:
        type: string
      result:
        type: string
    type: object
  handlers.rawMaterialUsageDTO:
    properties:
      cost:
        type: number
      finished_item_id:
        type: string
      id:
        type: string
      occurred_at:
        type: string
      quantity:
        type: number
      raw_item_id:
        type: string
      raw_sku:
        type: string
      transaction_type:
        type: string
    type: object
  handlers.readinessResponse:
    properties:
      dependencies:
        additionalProperties:
          type: string
        type: object
      status:
        example: OK
        type: string
    type: object
  handlers.relocateItemLocationRequest:
    properties:
      destination_warehouse_id:
        type: string
      item_ids:
        items:
          type: string
        type: array
      notes:
        type: string
      source_warehouse_id:
        type: string
    type: object
  handlers.requisitionDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.requisitionLineDTO'
        type: array
      notes:
        type: string
      outlet_id:
        type: string
      priority:
        type: string
      purpose:
        type: string
      reference_number:
        type: string
      request_type:
        type: string
      required_by_date:
        type: string
      status:
        type: string
    type: object
  handlers.requisitionLineDTO:
    properties:
      description:
        type: string
      duration:
        type: string
      estimated_price:
        type: number
      expected_deliverables:
        type: string
      id:
        type: string
      item_id:
        type: string
      item_type:
        type: string
      quantity:
        type: number
      service_description:
        type: string
      specifications:
        type: string
      supplier_id:
