basePath: /api/v1
definitions:
  github_com_bengobox_inventory-service_internal_modules_items.ItemDTO:
    properties:
      add_to_all_outlets:
        type: boolean
      allow_backorder:
        description: order when out of stock
        type: boolean
      available:
        description: |-
          Current stock levels (aggregated across all warehouses).
          Populated by ListItems; nil when no balance row exists.
        type: number
      barcode:
        description: Extended fields for POS, logistics, compliance
        type: string
      barcode_type:
        type: string
      booked_capacity:
        type: integer
      brand_code:
        type: string
      brand_id:
        type: string
      brand_name:
        type: string
      category_id:
        type: string
      category_name:
        type: string
      condition:
        description: NEW | REFURBISHED | USED | OPEN_BOX
        type: string
      cost_price:
        description: Cost / pricing fields
        type: number
      country_of_origin:
        description: customs / marketplace compliance
        type: string
      created_at:
        type: string
      description:
        type: string
      dimensions_cm:
        additionalProperties:
          format: float64
          type: number
        type: object
      duration_minutes:
        description: service duration (salon/barber)
        type: integer
      event_end_at:
        type: string
      event_start_at:
        type: string
      event_venue:
        type: string
      extra_bed_allowed:
        type: boolean
      gtin:
        description: E-commerce / online-store attributes
        type: string
      has_variants:
        description: |-
          Product variations — surfaced from the ItemVariant edge so retail can sell variations.
          HasVariants is always populated; Variants is populated when variants are eager-loaded
          (inline for single-item reads, or for the list when ?include=variants is requested).
        type: boolean
      hs_code:
        description: customs tariff code
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        description: |-
          Images surfaces the item's IMAGE assets (multi-image gallery). Populated when the
          `assets` edge is eager-loaded; primary first. ImageURL above remains the primary
          image URL for backward compatibility with single-image clients.
        items:
          $ref: '#/definitions/github_com_bengobox_inventory-service_internal_modules_items.ItemImageDTO'
        type: array
      initial_quantity:
        description: opening on-hand in the item's base unit; fractional allowed (e.g.
          4.5 L)
        type: number
      is_active:
        type: boolean
      is_controlled_substance:
        description: 'pharmacy: scheduled drugs'
        type: boolean
      is_discontinued:
        description: hidden from new listings, stock still sellable
        type: boolean
      is_perishable:
        type: boolean
      is_returnable:
        description: |-
          Pointers so a partial update (a client that doesn't send them) never clobbers the
          stored flag, and so create can distinguish "unset" (use schema default) from an
          explicit false — same rationale as NonBillable below. A plain bool can't do either.
        type: boolean
      manufacturer:
        description: Item-attribute fields (retail / pharmacy)
        type: string
      max_adults:
        type: integer
      max_children:
        type: integer
      max_selling_price:
        description: hard ceiling enforced at price upsert & POS
        type: number
      meal_plan:
        description: RO | BB | HB | FB | AI
        type: string
      meta_description:
        description: SEO
        type: string
      meta_title:
        description: SEO
        type: string
      metadata:
        additionalProperties: {}
        type: object
      min_selling_price:
        description: Selling-price guardrails + goods margin (Phase 4).
        type: number
      model:
        description: retail only
        type: string
      modifier_groups:
        description: |-
          ModifierGroups: this item's selectable modifiers (e.g. "Extra Honey" on a Dawa),
          enriched by enrichModifierGroups. Populated by ListItems for every catalog-facing
          caller (pos-api's terminal catalog proxy included) — see modifier_enrich.go.
        items:
          $ref: '#/definitions/github_com_bengobox_inventory-service_internal_modules_items.ItemModifierGroup'
        type: array
      mpn:
        description: manufacturer part number
        type: string
      name:
        type: string
      net_price:
        description: selling price excluding tax
        type: number
      non_billable:
        description: |-
          Non-billable: never charged at POS even when a selling price exists (free
          accompaniments like ugali, consumable supplies like tissue/packaging); stock still
          deducts. Pointer so partial updates never clobber the stored flag.
        type: boolean
      occupancy_basis:
        type: string
      on_hand:
        type: number
      preferred_supplier_id:
        description: |-
          Preferred Supplier for procurement (drives per-vendor PO split in procure-to-order).
          Accepted on create/update; PreferredSupplierName is read-only (populated when the edge is loaded).
        type: string
      preferred_supplier_name:
        type: string
      purchase_pack_size:
        type: number
      purchase_price:
        description: Purchase / supplier fields — enable auto EP-cost calculation
        type: number
      purchase_unit:
        type: string
      reorder_level:
        type: integer
      reorder_quantity:
        type: integer
      requires_age_verification:
        type: boolean
      return_window_days:
        description: nil = tenant default
        type: integer
      selling_price:
        description: |-
          Effective customer-facing price + tax split — enriched at read time for the POS/ordering
          proxies (recipe selling price → default pricing tier → cost+margin suggestion).
        type: number
      shelf_life_days:
        description: default shelf life; seeds lot expiry at receipt
        type: integer
      short_description:
        description: product-card description
        type: string
      single_supplement:
        type: number
      sku:
        type: string
      slug:
        description: storefront URL slug / SEO
        type: string
      stock_tracking_mode:
        description: |-
          Stock tracking mode: "default" (RECIPE items follow the tenant non-depletion
          policy) | "tracked" | "non_depleting" (sells without stock effect).
        type: string
      suggested_price:
        type: number
      tags:
        items:
          type: string
        type: array
      target_margin_percent:
        description: GOODS auto-pricing margin %
        type: number
      tax_amount:
        description: tax portion of the selling price
        type: number
      tax_code_id:
        description: KRA eTIMS tax fields
        type: string
      tax_inclusive:
        type: boolean
      tax_rate:
        description: VAT rate % applied (resolved from treasury-api)
        type: number
      total_capacity:
        description: Event capacity fields — SERVICE type only
        type: integer
      track_lots:
        type: boolean
      track_serial_numbers:
        type: boolean
      type:
        description: GOODS | SERVICE | RECIPE | INGREDIENT
        type: string
      unit_content_qty:
        description: |-
          Content-per-unit: how much of UnitContentUOM ONE stock unit contains (a 750ml
          whiskey bottle stocked in pieces → 750 + "ml"). Lets ml/g recipe lines (tots,
          pours) deduct fractional stock units.
        type: number
      unit_content_uom:
        type: string
      unit_id:
        type: string
      updated_at:
        type: string
      use_case:
        description: Hospitality fields — room-type / facility / amenity SERVICE items
        type: string
      variants:
        items:
          $ref: '#/definitions/github_com_bengobox_inventory-service_internal_modules_items.VariantDTO'
        type: array
      weight_kg:
        type: number
      yield_pct:
        description: 0 < y <= 1; default 1.0
        type: number
    type: object
  github_com_bengobox_inventory-service_internal_modules_items.ItemImageDTO:
    properties:
      created_at:
        type: string
      display_order:
        type: integer
      file_name:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      mime_type:
        type: string
      url:
        type: string
    type: object
  github_com_bengobox_inventory-service_internal_modules_items.ItemModifierGroup:
    properties:
      id:
        type: string
      is_required:
        type: boolean
      max_selections:
        type: integer
      min_selections:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/github_com_bengobox_inventory-service_internal_modules_items.ItemModifierOption'
        type: array
    type: object
  github_com_bengobox_inventory-service_internal_modules_items.ItemModifierOption:
    properties:
