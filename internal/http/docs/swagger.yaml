  github_com_bengobox_inventory-service_internal_modules_items.VariantDTO:
    properties:
      attributes:
        additionalProperties:
          type: string
        type: object
      barcode:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      sku:
        type: string
    type: object
  github_com_bengobox_inventory-service_internal_modules_recipes.RecipeDTO:
    properties:
      allergens:
        items:
          type: string
        type: array
      cost_per_portion:
        type: number
      food_cost_pct:
        type: number
      id:
        type: string
      ingredients:
        items:
