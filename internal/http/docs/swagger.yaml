info:
  contact: {}
  description: HTTP API for the Codevertex inventory service. Provides catalog, warehouse,
    and inventory management capabilities.
  title: Inventory Service API
  version: 0.1.0
paths:
  /{tenant}/inventory/adjustments/document:
    get:
      parameters:
      - description: Adjustment batch reference
        in: query
        name: reference
        required: true
        type: string
      - description: Narrow the batch to one warehouse
        in: query
        name: warehouse_id
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Generate a stock adjustment note for a reference batch
      tags:
      - stock
  /{tenant}/inventory/approval-requests:
    get:
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by module
        in: query
        name: module
        type: string
      - description: Filter by document ID
        in: query
        name: object_id
        type: string
      - description: Only requests awaiting the caller
        in: query
        name: inbox
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.approvalRequestDTO'
            type: array
      security:
      - bearerAuth: []
      summary: List approval requests
      tags:
      - Approvals
  /{tenant}/inventory/approval-rules:
    get:
      parameters:
      - description: Filter by module
        in: query
        name: module
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
