  github_com_bengobox_inventory-service_internal_modules_recipes.RecipeIngredientDTO:
    properties:
      display_order:
        type: integer
      id:
        type: string
      item_cost_price:
        type: number
      item_id:
        type: string
      item_name:
        type: string
      item_sku:
        type: string
      item_unit_id:
        description: |-
          The ingredient item's own base/stock unit. ItemCostPrice is per this unit,
          so a line written in another unit (e.g. ml against a per-L item) must be
          converted before multiplying — clients need this to preview line costs.
        type: string
      notes:
        type: string
      quantity:
        type: number
      sub_recipe_id:
        type: string
      sub_recipe_name:
        type: string
      unit_id:
        type: string
      unit_of_measure:
        type: string
      waste_percent:
        type: number
    type: object
  github_com_bengobox_inventory-service_internal_modules_reports.IngredientUtilizationSummary:
