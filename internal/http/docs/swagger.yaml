            $ref: '#/definitions/handlers.bulkJobAccepted'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bulk stock adjustment
      tags:
      - stock
  /{tenant}/inventory/stock/export:
    get:
      parameters:
      - description: pdf | csv
        in: query
        name: format
        type: string
      - description: item/SKU/warehouse search
        in: query
        name: search
        type: string
      - description: filter by category
        in: query
        name: category_id
        type: string
      - description: GOODS | INGREDIENT | EQUIPMENT
        in: query
        name: type
        type: string
      - description: filter to one warehouse
        in: query
        name: warehouse_id
        type: string
      - description: filter to one warehouse sub-location (zone/aisle/rack/shelf/bin)
        in: query
        name: location_id
        type: string
      - description: override the ambient X-Outlet-ID scope
        in: query
        name: outlet_id
        type: string
      - description: only items at/below reorder level
        in: query
        name: low_stock
        type: boolean
      - description: only items with zero available
        in: query
        name: out_of_stock
        type: boolean
      - description: category — render one section per category instead of one flat
          table
        in: query
        name: group_by
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - bearerAuth: []
      summary: Stock levels export document (PDF/CSV)
      tags:
      - Reports
  /{tenant}/inventory/stock/relocate:
    post:
      consumes:
      - application/json
      description: Moves each item's entire balance (on_hand/available, whatever it
        currently is, including zero) from the source warehouse to the destination,
        marking the source removed_from_location. Not a stock transfer — no quantity
        is chosen, nothing can be "insufficient".
      parameters:
      - description: Tenant ID
        in: path
        name: tenant
        required: true
        type: string
      - description: Item ids + source/destination warehouse
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.relocateItemLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/stock.RelocateItemLocationResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Relocate item(s) to another warehouse
      tags:
      - stock
  /{tenant}/inventory/stock/set-membership:
    post:
      consumes:
      - application/json
      description: Queues a background job that reconciles each item's current warehouse
        footprint against the given target set — check an outlet to add it, uncheck
        to remove. Returns 202 with a job id.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant
        required: true
        type: string
      - description: Item ids + target warehouse set
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.setItemOutletMembershipRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.bulkJobAccepted'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set which outlets an item is stocked in
      tags:
      - stock
  /{tenant}/inventory/supplier-performance:
    get:
      parameters:
      - description: Filter by supplier ID
        in: query
        name: supplier_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of supplierPerfDTO
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: List supplier performance records
      tags:
      - Procurement
    post:
      consumes:
      - application/json
      parameters:
      - description: Supplier performance payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.supplierPerfPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.supplierPerfDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Record a supplier performance evaluation
      tags:
      - Procurement
  /{tenant}/inventory/supplier-performance/recompute:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Recompute supplier performance from PO + GRN data
      tags:
      - Procurement
  /healthz:
    get:
      description: Returns OK when the inventory API process is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.livenessResponse'
      summary: Service liveness probe
      tags:
      - Health
  /metrics:
    get:
      description: Exposes Prometheus metrics for scraping.
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics payload
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - Health
  /readyz:
    get:
      description: Validates connectivity to Postgres, Redis, and NATS backends.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.readinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.readinessResponse'
      summary: Readiness probe
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  bearerAuth:
    description: 'JWT token from auth-service. Format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
